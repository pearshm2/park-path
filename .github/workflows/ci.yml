name: CI

# Run on every pull request into main, and on every push to main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ---------------------------------------------------------------
  # Job 1: Lint the Python code with Ruff (style + common bugs).
  # ---------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned to the same version as api/requirements.txt so CI and
      # everyone's laptop agree on what counts as a lint error.
      - name: Install Ruff
        run: pip install ruff==0.6.9
      - name: Run Ruff
        run: ruff check api/

  # ---------------------------------------------------------------
  # Job 2: Run the API test suite against a real Postgres database.
  # ---------------------------------------------------------------
  test-api:
    runs-on: ubuntu-latest

    # A "service container" is a throwaway Postgres that GitHub starts
    # next to this job and deletes when the job ends.
    services:
      postgres:
        image: postgres:16 # same version as api/docker-compose.yml
        env:
          POSTGRES_USER: parkpath
          POSTGRES_PASSWORD: parkpath
          POSTGRES_DB: parkpath
        ports:
          - 5432:5432
        # Don't start the steps until Postgres is actually accepting connections.
        options: >-
          --health-cmd "pg_isready -U parkpath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Environment variables visible to every step below. app/config.py
    # reads these, exactly like Render does in production.
    env:
      DATABASE_URL: postgresql://parkpath:parkpath@localhost:5432/parkpath
      SECRET_KEY: ci-only-not-a-real-secret
      ENVIRONMENT: test

    # Run every `run:` command from inside the api/ folder.
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # matches api/Dockerfile (python:3.11-slim)
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Builds the tables. This also catches a broken migration before
      # it reaches Render, where it would stop the API from starting.
      - name: Run database migrations
        run: alembic upgrade head

      - name: Run pytest
        run: pytest -v
  # ---------------------------------------------------------------
  # Job 3: The mobile app, and the contract between app and API.
  #
  # The API's contract is api/openapi.json (FastAPI's description of
  # every route and response). The app's TypeScript types for API
  # responses are generated from it into mobile/src/api/schema.ts.
  # This job fails if either file is out of date, or if the app no
  # longer type-checks against the API's real shapes.
  # See docs/api-contract.md.
  # ---------------------------------------------------------------
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install API dependencies
        run: pip install -r api/requirements.txt

      # Only reads the code; no database needed.
      - name: Check api/openapi.json is up to date
        working-directory: api
        run: |
          python -m app.export_openapi
          git diff --exit-code openapi.json || {
            echo "::error::api/openapi.json is out of date. In api/, run: python -m app.export_openapi (then npm run api:types in mobile/) and commit both files."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # npm install, not npm ci: lock files made on Windows leave out some
      # Linux-only packages (an npm bug), and npm ci refuses to run then.
      - name: Install app dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Check generated API types are up to date
        working-directory: mobile
        run: |
          npm run api:types
          git diff --exit-code src/api/schema.ts || {
            echo "::error::mobile/src/api/schema.ts is out of date. In mobile/, run: npm run api:types and commit it."
            exit 1
          }

      # Fails if the app's code no longer matches the API's real shapes.
      - name: Type-check the app
        working-directory: mobile
        run: npm run typecheck

      - name: Lint the app
        working-directory: mobile
        run: npm run lint
