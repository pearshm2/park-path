# Render "Blueprint": this file MUST live at the repo root; that's the only
# place Render looks for it. It describes the whole deployment, the API
# and its database, so Render can create both in one go
# (Dashboard -> New -> Blueprint).
#
# The FastAPI project lives in api/. Render reads dockerfilePath and
# dockerContext relative to the repo root, so both point into api/
# explicitly. buildFilter means only changes inside api/ trigger a
# redeploy (app-only changes don't rebuild the API).
#
# Free plan notes (see docs/deploy.md):
# - the API sleeps after 15 minutes without requests; the first request
#   after that takes about a minute
# - the free database is deleted 30 days after it's created
#
# Render terminates HTTPS for you; the app only has to listen on $PORT
# (api/Dockerfile's CMD does that, after running the database migrations).

databases:
  - name: parkpath-db
    plan: free
    region: virginia # must match the API's region
    postgresMajorVersion: "16" # same as docker-compose.yml
    databaseName: parkpath
    user: parkpath

services:
  - type: web
    name: parkpath-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    buildFilter:
      paths:
        - api/**
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parkpath-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*" # the mobile app isn't a browser, so CORS doesn't restrict it
      - key: SECRET_KEY
        generateValue: true # Render generates and stores a real random secret
      - key: NPS_API_KEY
        sync: false # entered by hand in the dashboard; never committed
      # Trip photos and videos (see docs/deploy.md, "Photo storage").
      - key: S3_BUCKET
        value: parkpath-photos
      - key: S3_REGION
        value: us-east-2
      # The bucket's own regional address, so uploads aren't redirected.
      - key: S3_ENDPOINT_URL
        value: https://s3.us-east-2.amazonaws.com
      - key: AWS_ACCESS_KEY_ID
        sync: false # the parkpath-api IAM user's key; never committed
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Google sign-in: the OAuth client ids, comma-separated.
      - key: GOOGLE_CLIENT_IDS
        sync: false
